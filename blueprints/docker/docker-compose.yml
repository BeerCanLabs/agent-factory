version: '3.8'

services:
  hermes-agent:
    build:
      context: ../..
      dockerfile: sidecar/Dockerfile
    container_name: factory-hermes-01
    environment:
      - AGENT_ID=hermes-researcher-01
      - AGENT_NAME=Hermes-Prime
      - AGENT_SECTOR=sector-eng
      - AGENT_ROLE=Deep Codebase Research & Analysis
      - AGENT_MODEL=hermes-3-llama-3.1-70b
      - AGENT_PROVIDER=aws-ecs
      - GARRISON_URL=http://host.docker.internal:3001
      - PORT=9091
    ports:
      - "9091:9091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  openclaw-agent:
    build:
      context: ../..
      dockerfile: sidecar/Dockerfile
    container_name: factory-openclaw-01
    environment:
      - AGENT_ID=openclaw-builder-01
      - AGENT_NAME=OpenClaw-Titan
      - AGENT_SECTOR=sector-ops
      - AGENT_ROLE=Continuous Sandbox & Deployment Worker
      - AGENT_MODEL=claude-3-7-sonnet
      - AGENT_PROVIDER=gcp-cloud-run
      - GARRISON_URL=http://host.docker.internal:3001
      - PORT=9092
    ports:
      - "9092:9092"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
