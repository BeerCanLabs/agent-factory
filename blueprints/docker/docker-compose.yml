services:
  control-plane:
    build:
      context: ../..
      dockerfile: packages/control-plane/Dockerfile
    container_name: factory-control-plane
    environment:
      - PORT=8088
      - AGENTS_ROOT=/app/agents
      - FACTORY_TOKEN=dev-token
      - FACTORY_SECRETS_FILE=/run/factory.secrets
      - FACTORY_LEDGER_PATH=/data/ledger.jsonl
      - MEMORY_STORE_DIR=/data/mind
      - MEMORY_EPHEMERAL_DIR=/data/ephemeral
      - FACTORY_IDLE_MS=60000
      - FACTORY_CRON=1
    volumes:
      - factory-data:/data
      - ./.env.example:/run/factory.secrets:ro
    ports:
      - "8088:8088"
    restart: "no"

  # Debug-only warm sidecar. Default factory path is scale-to-zero via control-plane wake.
  echo-sidecar:
    profiles: ["always-on"]
    build:
      context: ../..
      dockerfile: sidecar/Dockerfile
    container_name: factory-echo-sidecar
    environment:
      - AGENT_ID=echo-agent
      - AGENT_NAME=Echo
      - PORT=9090
      - PROXY_PORT=8080
      - UPSTREAM_LLM_BASE_URL=http://127.0.0.1:9
      - FACTORY_LEDGER_URL=http://control-plane:8088/api/v1/ledger
      - FACTORY_TOKEN=dev-token
      - SIDECAR_TOKEN=dev-token
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    depends_on:
      - control-plane

volumes:
  factory-data:
