# Prefer landing-zones/compose for new deploys. Kept as an alias.
services:
  control-plane:
    build:
      context: ../..
      dockerfile: packages/control-plane/Dockerfile
    environment:
      - PORT=8088
      - AGENTS_ROOT=/app/agents
      # Dev-only tokens. Each service gets its own name and least role.
      - FACTORY_TOKEN=dev-admin-token
      - 'FACTORY_TOKENS=[{"name":"doorman","token":"dev-doorman-token","roles":["operator"]},{"name":"sidecar","token":"dev-ingest-token","roles":["ingest"]}]'
      - DOORMAN_TOKEN=dev-presence-token
      - SIDECAR_TOKEN=dev-sidecar-token
      - FACTORY_RUN_TOKEN_KEY=dev-run-token-key-0123456789abcdef
      - FACTORY_CALLBACK_SIGNING_KEY=dev-callback-signing-key
      - FACTORY_PUBLIC_URL=http://127.0.0.1:8088
      - FACTORY_SECRETS_FILE=/run/factory.secrets
      - FACTORY_LEDGER_PATH=/data/ledger.jsonl
      - MEMORY_STORE_DIR=/data/mind
      - MEMORY_EPHEMERAL_DIR=/data/ephemeral
      - DOORMAN_URL=http://doorman:8090
    volumes:
      - factory-data:/data
      - ../../landing-zones/docker-secrets.env:/run/factory.secrets:ro
    ports:
      - "8088:8088"
    restart: "no"

  doorman:
    build:
      context: ../..
      dockerfile: packages/doorman/Dockerfile
    environment:
      - PORT=8090
      - FACTORY_URL=http://control-plane:8088
      - FACTORY_TOKEN=dev-doorman-token
      - DOORMAN_TOKEN=dev-presence-token
      - FACTORY_SECRETS_FILE=/run/factory.secrets
    volumes:
      - ../../landing-zones/docker-secrets.env:/run/factory.secrets:ro
    ports:
      - "8090:8090"
    restart: "no"
    depends_on:
      - control-plane

volumes:
  factory-data:
