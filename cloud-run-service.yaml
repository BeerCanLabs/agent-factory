# Example agent on Cloud Run under the factory shim. The worker has no provider keys: the shim points
# stock SDKs at the fleet egress gateway and uses the run token (injected per run by the control plane)
# as their API key. Pair with Direct VPC egress "all-traffic" on a subnet with no Cloud NAT, so the
# gateway is the only route out.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: example-agent-worker
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/vpc-access-egress: all-traffic
    spec:
      containers:
      - name: worker
        image: gcr.io/YOUR_PROJECT_ID/your-agent-on-factory-runtime:latest
        env:
        - name: AGENT_ID
          value: "example-agent"
        - name: FACTORY_URL
          value: "https://factory.internal"
        - name: FACTORY_GATEWAY_URL
          value: "http://gateway.factory.internal:8081"
        - name: MEMORY_DIR
          value: "/tmp/mind"
        - name: MEMORY_PREFIX
          value: "example-agent"
