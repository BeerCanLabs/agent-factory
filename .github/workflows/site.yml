# Builds the public site (site/, GAP-135, TSK-195) and, on a merge to main, publishes it to GitHub Pages.
# The site is static and built from files in this repository, so a change that makes it disagree with the code
# (site/check.mjs) fails here before it can be published.
name: site
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'packages/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# A pull request run has its own group, so it can never displace or cancel a deploy queued from main.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node site/build.mjs
      - run: node site/check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    # Only a push to main (or a manual run on main) publishes; a pull request only builds and checks.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
