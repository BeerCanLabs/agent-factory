name: deploy-aws
# Manual only. Assumes the factory-deploy role via GitHub OIDC (no stored AWS keys); the role's trust
# policy only admits refs/heads/main of this repo. scripts/bcl-aws still verifies the account.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-prod
    env:
      BCL_AWS_ACCOUNT_ID: ${{ vars.BCL_AWS_ACCOUNT_ID }}
      FACTORY_CERT_ARN: ${{ vars.FACTORY_CERT_ARN }}
      FACTORY_DOMAIN: ${{ vars.FACTORY_DOMAIN }}
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install && npm test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.BCL_AWS_ACCOUNT_ID }}:role/factory-deploy
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: ./scripts/aws-deploy.sh
