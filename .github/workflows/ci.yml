name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run validate

  compose-proof:
    # Proves the paper's claims against real containers: network isolation, run tokens, gateway
    # metering and budget, harness, kill switch, ledger chain + WORM anchor, tamper refusal.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: ./scripts/compose-e2e.sh
