name: ci
on:
  push:
  pull_request:
  # Nightly on main: rebuilds every image and refreshes the shared build cache, so a change outside this repository
  # (a base image, a package registry) is caught within a day, and daytime builds reuse fresh layers.
  schedule:
    - cron: '17 7 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # npm ci installs exactly the lockfile and never rewrites it (GAP-172).
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: (cd agents/examples/starter-python && python3 -m unittest discover -s tests)
      - run: (cd agents/staff/factory-manager && python3 -m unittest discover -s tests)
      - run: (cd runtimes/agent-runtime && python3 -m unittest discover -s tests)

  compose-proof:
    # Proves the paper's claims against real containers: network isolation, run tokens, gatekeeper-egress
    # metering and budget, harness, kill switch, ledger chain + WORM anchor, tamper refusal.
    # Runs alongside `test` (GAP-172); both are required to merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Console UI changes run independently of kernel container proof (GAP-187, TSK-255, TSK-256).
      - name: Check changed paths
        id: check_paths
        run: |
          # Only pull requests can skip container proof; schedules and pushes always run proof
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event is ${{ github.event_name }}. Running full kernel container proof."
            echo "skip_proof=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # On PR merge commits (refs/pull/*/merge), HEAD^1 is the target base branch
          CHANGED=""
          if git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)
          else
            BASE="origin/${{ github.base_ref || 'main' }}"
            git fetch origin "${{ github.base_ref || 'main' }}" || true
            CHANGED=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || true)
          fi

          if [ -z "$CHANGED" ]; then
            echo "Unable to reliably determine changed files. Failing safe: running container proof."
            echo "skip_proof=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NON_CONSOLE=$(echo "$CHANGED" | grep -v '^packages/console/' | grep -v '^DESIGN_AUTHORITY.md' || true)
          if [ -z "$NON_CONSOLE" ]; then
            echo "Changes are strictly isolated to packages/console/ (GAP-187). Skipping kernel container proof."
            echo "skip_proof=true" >> "$GITHUB_OUTPUT"
          else
            echo "Changes include non-console files (${NON_CONSOLE//$'\n'/, }). Running kernel container proof."
            echo "skip_proof=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.check_paths.outputs.skip_proof != 'true'
        id: buildx
      # Exposes the Actions cache service to the build commands below.
      - uses: crazy-max/ghaction-github-runtime@v3
        if: steps.check_paths.outputs.skip_proof != 'true'
      # Build every production image from this clean checkout, exactly as a deploy does, before anything
      # (npm install, builds) can leave artifacts behind. A deploy must never be the first place one fails.
      # One at a time: building them concurrently was no faster on the runner (GAP-172).
      # Layers come from the nightly cache when they still match. The nightly run on main builds from scratch
      # (no cache, fresh base images) and writes it, so a pull request never fills it and a layer is at most a day old.
      - name: Build production images
        if: steps.check_paths.outputs.skip_proof != 'true'
        env:
          WRITE_CACHE: ${{ github.event_name == 'schedule' }}
        run: |
          set -e
          for spec in packages/control-plane/Dockerfile: packages/gatekeeper/Dockerfile: packages/gatekeeper/ingress.Dockerfile: \
                      packages/console/Dockerfile: runtimes/generic/Dockerfile:examples/echo-agent \
                      runtimes/generic/Dockerfile:examples/llm-summarizer; do
            f="${spec%%:*}"; c="${spec#*:}"
            scope="$(echo "$f-$c" | tr '/:.' '---')"
            # Nightly: build from scratch with fresh base images and write the result; otherwise: read only.
            if [ "$WRITE_CACHE" = true ]; then cache=(--no-cache --pull --cache-to "type=gha,mode=max,scope=$scope")
            else cache=(--cache-from "type=gha,scope=$scope"); fi
            echo "::group::$f ${c}"
            docker buildx build --builder "${{ steps.buildx.outputs.name }}" --load --platform linux/amd64 -f "$f" \
              ${c:+--build-arg CARTRIDGE=$c} "${cache[@]}" .
            echo "::endgroup::"
          done
      - uses: actions/setup-node@v4
        if: steps.check_paths.outputs.skip_proof != 'true'
        with:
          node-version: '22'
          cache: npm
      # npm ci leaves package-lock.json untouched, so compose-e2e.sh reuses the images built above (GAP-172).
      - run: npm ci
        if: steps.check_paths.outputs.skip_proof != 'true'
      # The same builder as above, so compose reuses the layers just built.
      - run: ./scripts/compose-e2e.sh
        if: steps.check_paths.outputs.skip_proof != 'true'
        env:
          COMPOSE_BUILDER: ${{ steps.buildx.outputs.name }}
