name: ci
on:
  push:
  pull_request:
  # Nightly on main: rebuilds every image and refreshes the shared build cache, so a change outside this repository
  # (a base image, a package registry) is caught within a day, and daytime builds reuse fresh layers.
  schedule:
    - cron: '17 7 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # npm ci installs exactly the lockfile and never rewrites it (GAP-172).
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: (cd agents/examples/starter-python && python3 -m unittest discover -s tests)

  compose-proof:
    # Proves the paper's claims against real containers: network isolation, run tokens, gatekeeper-egress
    # metering and budget, harness, kill switch, ledger chain + WORM anchor, tamper refusal.
    # Runs alongside `test` (GAP-172); both are required to merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        id: buildx
      # Exposes the Actions cache service to the build commands below.
      - uses: crazy-max/ghaction-github-runtime@v3
      # Build every production image from this clean checkout, exactly as a deploy does, before anything
      # (npm install, builds) can leave artifacts behind. A deploy must never be the first place one fails.
      # One at a time: building them concurrently was no faster on the runner (GAP-172).
      # Layers come from the nightly cache when they still match; only the nightly run on main writes it, so a
      # pull request never fills the cache and a stale layer is at most a day old.
      - name: Build production images
        env:
          WRITE_CACHE: ${{ github.event_name == 'schedule' }}
        run: |
          set -e
          for spec in packages/control-plane/Dockerfile: packages/gatekeeper/Dockerfile: packages/gatekeeper/ingress.Dockerfile: \
                      packages/console/Dockerfile: runtimes/generic/Dockerfile:examples/echo-agent \
                      runtimes/generic/Dockerfile:examples/llm-summarizer; do
            f="${spec%%:*}"; c="${spec#*:}"
            scope="$(echo "$f-$c" | tr '/:.' '---')"
            to=(); [ "$WRITE_CACHE" = true ] && to=(--cache-to "type=gha,mode=max,scope=$scope")
            echo "::group::$f ${c}"
            docker buildx build --builder "${{ steps.buildx.outputs.name }}" --load --platform linux/amd64 -f "$f" \
              ${c:+--build-arg CARTRIDGE=$c} --cache-from "type=gha,scope=$scope" "${to[@]}" .
            echo "::endgroup::"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # npm ci leaves package-lock.json untouched, so compose-e2e.sh reuses the images built above (GAP-172).
      - run: npm ci
      # The same builder as above, so compose reuses the layers just built.
      - run: ./scripts/compose-e2e.sh
        env:
          COMPOSE_BUILDER: ${{ steps.buildx.outputs.name }}
