schemaVersion: "1.0"
id: echo-agent
name: "Echo Agent"
role: "Diagnostic Echo"
prompt: "./soul.md"
triggers:
  - type: http
    path: /wake
  - type: webhook
    path: /hooks/echo
    secretRef: ECHO_WEBHOOK_SECRET
secrets:
  requires:
    - name: ECHO_WEBHOOK_SECRET
compute:
  kind: oci
  ref: oci://ghcr.io/beercanlabs/factory-echo-agent:test
