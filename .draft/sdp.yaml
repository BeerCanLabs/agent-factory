schemaVersion: '1.0'
uid: 01M7KQAQCD-VV8V
type: software_deployment_pattern
name: BeerCanLabs Agent Factory
aliases:
  - Agent Factory
  - Agent Factory Platform
description: >-
  Turnkey headless hosting substrate for autonomous AI agent fleets organized into three
  architectural tiers: (1) Hot-Swappable Heads (Web Console SPA :3000, Factory CLI, Agent
  Garrison :3000, and external MCP clients holding zero authority or secrets), (2) the
  Headless Neck (typed /api/v1/* REST, OpenAPI 3.1, Principal/Agent/Run MCP surfaces, and
  an OAuth 2.1 Authorization Server with PKCE & RFC 9728 PRM), and (3) the 10-service Factory
  Body (Gatekeeper, Keymaster, Executive, Property Manager, Auditor, Accountant, Bouncer,
  Timekeeper, Registrar, Inspector) running disposable min=0 Dual-Mode cartridges inside
  zero-internet-egress subnets backed by S3 Mind Safe hydration and a SHA-256 hash-chained
  EFS + S3 Object Lock COMPLIANCE WORM ledger.
version: 2.0.0
catalogStatus: complete
lifecycleStatus: preferred
followsReferenceArchitecture: 01KV0REFAR-CMSV
owner:
  team: platform-ai-team
  contact: platform-ai@example.com
tags:
  - agent-factory
  - multi-cloud
  - headless-neck
  - mcp
  - oauth21
  - zero-trust
  - aws-ecs
businessContext:
  productFamily: Skippy / Agent Factory
notes:
  availabilityTarget: 99.9%
  availabilityRequirement: >-
    Mailboxes (Cloudflare + ALB ingress, Control Plane, gatekeeper-ingress, gatekeeper-egress,
    Console) remain continuously reachable; Control Plane is a single writer (desiredCount=1,
    stop-before-start) to preserve ledger hash-chain linearity while retrying agent long-polls.
    Agent cartridge compute scales to zero (min=0) when idle.
  dataClassification: >-
    Confidential — execution ledger stores metadata and payloadSha256 only (secrets masked,
    zero prompt text in ledger); per-agent mind Safe holds adopter data encrypted with AES-256.
  failureDomain:
    scope: service-group
    description: >-
      Control Plane outage pauses new wakes and MCP calls without corrupting the WORM-anchored
      ledger; gatekeeper-ingress failure affects Discord Gateway presence only; individual
      cartridge crashes or OOMs isolate to a single ephemeral RunTask container and trip
      crash-loop quarantine after threshold failures.
  patternDeviations: >-
    Follows Containerized Microservices (Orchestrated Tasks, 01KV0REFAR-CMSV) for persistent
    mailbox services on AWS ECS Fargate (landing-zones/aws), while agent workers follow
    Serverless Event-Driven scale-to-zero (01KS8N4KR4-SVED, ECS RunTask per wake, zero 24/7
    agent services) in isolated route=[] subnets, and east-west discovery uses AWS Cloud Map
    (factory.internal) + SG microsegmentation rather than a sidecar service mesh. Also supports
    Compose Host (landing-zones/compose) and Serverless Containers slot bindings.
networkZones:
  - id: edge
    name: Edge & Identity-Aware Ingress
    tier: frontend
    description: >-
      Cloudflare Zero Trust Access, WAF custom rules, rate-limiting, /.cf-fk-bypass strip
      Worker, and HTTPS-only TLS 1.3 AWS ALB restricted strictly to Cloudflare ingress CIDRs.
  - id: mailbox
    name: Mailbox & Headless Neck Services
    tier: application
    description: >-
      Public service subnets hosting Control Plane (:8088/:8089), gatekeeper-ingress (:8090),
      gatekeeper-egress (:8081), and Stateless Web Console (:3000) under Cloud Map DNS.
  - id: agents
    name: Zero-Egress Agent Compute
    tier: application
    description: >-
      Private subnets with route=[] (no NAT gateways, no internet gateways). Disposable RunTask
      containers reach only Control Plane (:8088), gatekeeper-egress (:8081), and VPC endpoints.
  - id: data
    name: Durable Mind, WORM Ledger & Package Storage
    tier: data
    description: >-
      Encrypted EFS single-writer hot ledger volume (:2049) and versioned/Object-Lock S3
      buckets for agent minds, COMPLIANCE WORM checkpoints, configs, and skill packages.
serviceGroups:
  - name: Edge & Public Ingress
    deploymentTarget: aws-us-east-1
    deployableObjects:
      - ref: 01M7KQAQCD-HXQZ
        networkZone: edge
        diagramTier: presentation
        intent: ha
        notes: Cloudflare Zero Trust Access + Edge Worker fronting HTTPS TLS 1.3 AWS ALB.
  - name: Headless Neck, Console & Mailbox Services
    deploymentTarget: aws-us-east-1
    substrate: 01M7KQAQCD-WRAE
    deployableObjects:
      - ref: 01M7KQAQCD-WRAE
        networkZone: mailbox
        diagramTier: application
        intent: ha
        notes: AWS ECS Fargate cluster orchestrating persistent mailbox services and RunTask workers.
      - ref: 01M7KQAQCD-V4TP
        networkZone: mailbox
        diagramTier: application
        intent: sa
        notes: Single-writer Control Plane (:8088/:8089) hosting REST, MCP Neck, OAuth 2.1 AS, and 8 Cast modules.
      - ref: 01M7KQAQCD-G3DY
        networkZone: mailbox
        diagramTier: utility
        intent: sa
        notes: Fargate On-Demand gatekeeper-ingress (:8090) holding optional Discord Gateway presence.
      - ref: 01M7KQAQCD-E48K
        networkZone: mailbox
        diagramTier: presentation
        intent: ha
        notes: Zero-secret Web Console SPA (:3000) forwarding caller assertions to Control Plane.
      - ref: 01M7KQAQCD-01CD
        networkZone: edge
        diagramTier: presentation
        intent: sa
        notes: Operator factory CLI and factory-bench deterministic Cost-vs-Quality harness.
  - name: Zero-Egress Agent Cartridge Runtime & Perimeter
    deploymentTarget: aws-us-east-1
    substrate: 01M7KQAQCD-WRAE
    deployableObjects:
      - ref: 01M7KQAQCD-EH0J
        networkZone: agents
        diagramTier: application
        intent: sa
        notes: Scale-to-zero Shared Runtime, Generic Cartridge, and Python House Staff containers wrapped by PID 1 hydrate shim.
      - ref: 01M7KQAQCD-AH4Q
        networkZone: mailbox
        diagramTier: application
        intent: ha
        notes: gatekeeper-egress (:8081) zero-trust reverse & HTTP CONNECT forward proxy with S1 secret injection.
      - ref: 01M7KQAQCD-VPEH
        networkZone: mailbox
        diagramTier: application
        intent: ha
        notes: Executive + gatekeeper-egress model & MCP proxy metering LLM/BYOM usage and enforcing Bouncer holds.
  - name: Admission Pipeline & Enterprise Event Bus
    deploymentTarget: aws-us-east-1
    deployableObjects:
      - ref: 01M7KQAQCD-WD0R
        networkZone: mailbox
        diagramTier: utility
        intent: ha
        notes: CodeBuild projects (agent-builder, skills-builder, skill-checker) and scan-on-push ECR registries.
      - ref: 01M7KQAQCD-GHF4
        networkZone: mailbox
        diagramTier: utility
        intent: ha
        notes: Amazon EventBridge bus publishing run outcomes, budget alerts, crashes, and approval events.
  - name: Durable Mind, WORM Ledger & Package Stores
    deploymentTarget: aws-us-east-1
    deployableObjects:
      - ref: 01M7KQAQCD-FP9D
        networkZone: data
        diagramTier: data
        intent: ha
        notes: Encrypted multi-AZ EFS volume (:2049) for single-writer hash-chained ledger.jsonl and active state.
      - ref: 01M7KQAQCD-EEEE
        networkZone: data
        diagramTier: data
        intent: ha
        notes: Encrypted S3 buckets for Mind Safe, Object Lock COMPLIANCE WORM checkpoints, versioned config, and SHA-256 skill packages.
tierVariants:
  - tier: 01M7KQAQCC-T9DS
    deploymentTarget:
      provider: aws
      region: us-east-1
    serviceGroupVariants:
      - serviceGroup: Headless Neck, Console & Mailbox Services
        replicaCount: 1
        notes: Control plane fixed at replicaCount=1 (minHealthy=0, max=100) for single-writer ledger integrity.
      - serviceGroup: Zero-Egress Agent Cartridge Runtime & Perimeter
        autoscaling:
          enabled: true
          min: 0
          max: 50
        notes: Agent cartridges scale from 0 via ECS RunTask per wake; gatekeeper-egress runs on Fargate Spot.
  - tier: 01M7KQAQCC-EG06
    deploymentTarget:
      provider: on-premises
    notes: >-
      Single-host Docker Compose stack (landing-zones/compose) enforcing internal factory-agents
      bridge isolation, docker-socket-proxy container spawning, and CI compose-proof verification.
