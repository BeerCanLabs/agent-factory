schemaVersion: '1.0'
uid: SDP0000002-AGENTFACTORY
type: software_deployment_pattern
name: BeerCanLabs Agent Factory Product Pattern
description: >-
  Multi-cloud substrate for autonomous AI agent fleets. Kernel is the position-paper
  contract: portable cartridges, scale-to-zero, secret binding, factory sidecar intercept,
  immutable ledger, headless REST/MCP. Garrison is a privileged client, not kernel.
version: 1.0.0
catalogStatus: complete
lifecycleStatus: preferred
canonicalDoc: POSITION_PAPER.md
owner:
  team: platform-ai-team
  contact: platform-ai@example.com
tags:
  - agent-factory
  - multi-cloud
  - core-product
  - substrate
serviceGroups:
  - id: agent-factory-kernel
    name: Mandatory Factory Kernel
    deploymentTarget: Multi-Cloud (GCP Cloud Run, AWS ECS Fargate, Docker)
    components:
      - productComponent: cartridge-contract
      - productComponent: factory-control-plane
      - productComponent: factory-sidecar-intercept
      - productComponent: secret-binding
      - productComponent: memory-hydrate
      - productComponent: postgres-audit-ledger
  - id: agent-factory-overlays
    name: Optional clients (not kernel)
    deploymentTarget: Adopter
    components:
      - productComponent: garrison-telemetry-sink
  - id: agent-factory-deferred
    name: Deferred — not factory kernel
    deploymentTarget: none
    components:
      - productComponent: doorman-lease-broker
      - productComponent: litellm-route-proxy
      - productComponent: promptfoo-training-gym
      - productComponent: oauth-obo-broker
deployableObjects:
  - dataStoreService: 01M15NEKT7-H42Y
  - aiGateway: 01M15NEKT7-QKPW
