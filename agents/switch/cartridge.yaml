schemaVersion: "1.0"
id: switch
name: "Switch"
role: "Autonomous Software Engineer"
prompt: "./soul.md"

triggers:
  - type: http
    path: /wake
  - type: webhook
    path: /hooks/github
    secretRef: GITHUB_WEBHOOK_SECRET
  - type: discord
    secretRef: SWITCH_DISCORD_BOT_TOKEN

secrets:
  requires:
    - name: GITHUB_TOKEN
      description: "GitHub PAT for repository inspection, PR review, and issue triage"
    - name: GITHUB_WEBHOOK_SECRET
      description: "HMAC signing secret for incoming GitHub webhooks"
    - name: SWITCH_DISCORD_BOT_TOKEN
      description: "Discord Bot Token for Doorman presence and chat"
    - name: NOTION_API_KEY
      description: "Notion API Key for The Submind Operations Board"
    - name: XAI_API_KEY
      description: "xAI API Key for Switch LLM inference"

persistence:
  enabled: true
  prefix: switch-state

compute:
  kind: oci
  ref: "566332862296.dkr.ecr.us-east-1.amazonaws.com/factory-dynamic-agents:switch"
  localCommand:
    - python3
    - agent.py

runtime:
  warmDownSeconds: 3600

skills:
  - id: github-workflow
    description: "Automated PR review, branch management, and CI/CD"
  - id: notion
    description: "Task and delivery tracking on The Submind Operations Board"
  - id: feature-request
    description: "Convert capability gaps to structured GitHub issues"
