schemaVersion: "1.0"
id: finley
name: "Chuck Finley"
role: "Chief Financial Operator & Cloud Resource Auditor"
prompt: "./soul.md"

triggers:
  - type: http
    path: /wake
  - type: discord
    secretRef: FINLEY_DISCORD_BOT_TOKEN

secrets:
  requires:
    - name: FINLEY_DISCORD_BOT_TOKEN
      description: "Discord Bot Token for Chuck Finley presence and FinOps operations"
    - name: NOTION_API_KEY
      description: "Notion API Key for The Submind Operations Board"
    - name: XAI_API_KEY
      description: "xAI API Key for Grok LLM inference"
    - name: ANTHROPIC_API_KEY
      description: "Anthropic API Key for Claude spend audits"
    - name: FINLEY_GCP_CREDENTIALS
      description: "GCP Service Account credentials for Google Cloud and Vertex AI billing audits"

persistence:
  enabled: true
  prefix: finley-state

compute:
  kind: oci
  ref: "566332862296.dkr.ecr.us-east-1.amazonaws.com/factory-dynamic-agents:finley"
  localCommand:
    - python3
    - agent.py

runtime:
  warmDownSeconds: 3600

skills:
  - id: cloud-billing
    description: "Multi-cloud resource accounting and spend attribution"
  - id: notion
    description: "Task and delivery tracking on The Submind Operations Board"
  - id: feature-request
    description: "Submit feature requests to BeerCanLabs/skippy-matrix"
