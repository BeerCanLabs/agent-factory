schemaVersion: "1.0"
id: factory-manager
name: "Factory Manager"
role: "House staff: fleet questions and actions for the factory CLI"
prompt: "./soul.md"
category: user

triggers:
  - type: http
    path: /wake

secrets:
  requires: []

persistence:
  enabled: true
  prefix: factory-manager

memory:
  archetype: personal-assistant
  retentionDays: 30
  maxMessages: 40
  maxChars: 24000

runtime:
  warmDownSeconds: 900

compute:
  kind: oci
  ref: "ghcr.io/beercanlabs/factory-manager:latest"
  localCommand:
    - python3
    - agent.py

egress:
  routes:
    - models
