schemaVersion: "1.0"
id: starter-python
name: "Operations Assistant"
role: "Operations & Incident Triage"
prompt: "./soul.md"

triggers:
  - type: http
    path: /wake
  - type: webhook
    path: /hooks/ops-alerts
    secretRef: webhook_secret
  - type: discord
    secretRef: bot_token

secrets:
  requires:
    - name: webhook_secret
      system: webhook
      description: "HMAC signing secret for inbound webhook verification"
    - name: bot_token
      system: discord
      description: "Discord bot token for operations assistant"
    - name: OPS_NOTIFY_WEBHOOK
      system: webhook
      description: "Webhook URL to send high-severity alerts to the team"

persistence:
  prefix: starter-python-state

compute:
  kind: oci
  ref: "ghcr.io/beercanlabs/starter-python:latest"
  localCommand:
    - python3
    - agent.py
