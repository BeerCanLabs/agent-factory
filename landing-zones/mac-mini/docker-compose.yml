# Landing zone: Mac mini / Linux VM (Docker).
# Doorman is always on and idle. No Discord app required.
services:
  control-plane:
    build:
      context: ../..
      dockerfile: packages/control-plane/Dockerfile
    environment:
      - PORT=8088
      - AGENTS_ROOT=/app/agents
      - FACTORY_AUTH=bearer
      - FACTORY_TOKEN=dev-token
      - FACTORY_SECRETS_FILE=/run/factory.secrets
      - FACTORY_LEDGER_PATH=/data/ledger.jsonl
      - MEMORY_STORE_DIR=/data/mind
      - MEMORY_EPHEMERAL_DIR=/data/ephemeral
      - FACTORY_IDLE_MS=60000
      - FACTORY_CRON=1
      - DOORMAN_URL=http://doorman:8090
    volumes:
      - factory-data:/data
      - ../docker-secrets.env:/run/factory.secrets:ro
    ports:
      - "8088:8088"
    restart: "no"

  doorman:
    build:
      context: ../..
      dockerfile: packages/doorman/Dockerfile
    environment:
      - PORT=8090
      - FACTORY_URL=http://control-plane:8088
      - FACTORY_TOKEN=dev-token
      - FACTORY_SECRETS_FILE=/run/factory.secrets
    volumes:
      - ../docker-secrets.env:/run/factory.secrets:ro
    ports:
      - "8090:8090"
    restart: "no"
    depends_on:
      - control-plane

volumes:
  factory-data:
